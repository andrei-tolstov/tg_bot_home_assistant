services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_bot_home_assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Если Home Assistant запущен на том же сервере/хосте (Linux):
    # network_mode: host
    # 
    # Либо для доступа к хосту через host.docker.internal:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
